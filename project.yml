# Fallback for older Xcode versions: `brew install xcodegen && xcodegen` regenerates SvenskaVocab.xcodeproj.
name: SvenskaVocab
options:
  bundleIdPrefix: com.xingkai03
  deploymentTarget:
    iOS: "17.0"
targets:
  SvenskaVocab:
    type: application
    platform: iOS
    sources: [SvenskaVocab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingkai03.SvenskaVocab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Svenska
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
  SvenskaVocabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SvenskaVocabTests]
    dependencies:
      - target: SvenskaVocab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingkai03.SvenskaVocabTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SvenskaVocab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SvenskaVocab"
        BUNDLE_LOADER: "$(TEST_HOST)"
