# Publishes the web version (web/) to GitHub Pages.
# One-time setup: repository Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Web version

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "SvenskaVocab/Resources/*.tsv"
      - "SvenskaVocab/Resources/Decks/**"
      - "scripts/build_web.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 scripts/build_web.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
